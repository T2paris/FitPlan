var GC={push:"#EF4444",pull:"#3B82F6",legs:"#22C55E",core:"#888"};

var S={
  week:parseInt(localStorage.getItem("bbt_week")||"1"),
  view:"dash",
  checks:JSON.parse(localStorage.getItem("bbt_checks")||"{}"),
  verts:JSON.parse(localStorage.getItem("bbt_verts")||'[{"date":"Inicio","value":52}]'),
  weights:JSON.parse(localStorage.getItem("bbt_weights")||'[{"date":"Inicio","value":88}]'),
  sec:JSON.parse(localStorage.getItem("bbt_sec")||"{}")
};

function sv(){
  localStorage.setItem("bbt_week",S.week);
  localStorage.setItem("bbt_checks",JSON.stringify(S.checks));
  localStorage.setItem("bbt_verts",JSON.stringify(S.verts));
  localStorage.setItem("bbt_weights",JSON.stringify(S.weights));
  localStorage.setItem("bbt_sec",JSON.stringify(S.sec));
}

function po(w){return w<=4?1:w<=8?2:3;}
function ph(){return PH[po(S.week)-1];}
function plan(){return DAY_PLAN[po(S.week)];}
function latV(){return S.verts[S.verts.length-1].value;}
function latW(){return S.weights[S.weights.length-1].value;}
function mk(di,t,id){return S.week+"-"+di+"-"+t+"-"+id;}
function iD(di,t,id){return !!S.checks[mk(di,t,id)];}

function tog(di,t,id){
  var k=mk(di,t,id);
  S.checks[k]=!S.checks[k];
  sv();render();
}
function setW(w){S.week=w;sv();render();}
function setV(v){S.view=v;render();}

function secOpen(k,def){
  if(def===undefined)def=true;
  return S.sec.hasOwnProperty(k)?S.sec[k]:def;
}
function toggleSec(k,def){
  if(def===undefined)def=true;
  var cur=secOpen(k,def);
  S.sec[k]=!cur;
  sv();render();
}

function blip(){
  var e=document.getElementById("fl");
  e.style.display="inline";
  setTimeout(function(){e.style.display="none";},1200);
}

function addVert(){
  var v=parseFloat(document.getElementById("vIn").value);
  if(!v||v<20||v>130)return;
  var d=new Date().toLocaleDateString("pt-PT",{day:"2-digit",month:"short"});
  S.verts.push({date:d,value:v});
  sv();blip();render();
}
function addWt(){
  var w=parseFloat(document.getElementById("wIn").value);
  if(!w||w<40||w>200)return;
  var d=new Date().toLocaleDateString("pt-PT",{day:"2-digit",month:"short"});
  S.weights.push({date:d,value:w});
  sv();blip();render();
}

function dayProg(di){
  var d=plan()[di];
  var gE=d.gym?GYM[d.gym]:[];
  var sE=d.skill?SKILL[d.skill]:[];
  var vE=d.vert?VERT[po(S.week)]:[];
  var tot=gE.length+sE.length+vE.length;
  var done=0;
  for(var i=0;i<gE.length;i++)if(iD(di,"g",gE[i].id))done++;
  for(var i=0;i<sE.length;i++)if(iD(di,"s",sE[i].id))done++;
  for(var i=0;i<vE.length;i++)if(iD(di,"v",vE[i].id))done++;
  return {done:done,tot:tot};
}

function bar(v,color,h){
  h=h||5;
  var pct=Math.min(100,Math.max(0,v));
  return '<div class="bw" style="height:'+h+'px"><div class="bf" style="width:'+pct+'%;height:100%;background:'+color+'"></div></div>';
}

function sched(phase,di){
  var k="sc-"+phase+"-"+di;
  var open=secOpen(k,true);
  var items=SCHED[phase+"-"+di]||[];
  var h='<div class="sw">';
  h+='<button class="sh" onclick="toggleSec(\''+k+'\',true)">';
  h+='<span>&#128344;</span>';
  h+='<span class="st">HORARIO DO DIA</span>';
  h+='<span class="sk">'+items.length+' blocos</span>';
  h+='<span style="font-size:10px;color:#555;margin-left:2px">'+(open?"&#9650;":"&#9660;")+'</span>';
  h+='</button>';
  if(open){
    h+='<div class="sd">';
    for(var i=0;i<items.length;i++){
      var item=items[i];
      var nl=i<items.length-1;
      h+='<div class="si">';
      if(nl)h+='<div class="sl" style="background:'+item.c+'33"></div>';
      h+='<div class="sd2" style="background:'+item.c+'"></div>';
      h+='<div class="sc">';
      h+='<div class="str"><span class="stm">'+item.t+'</span><span class="sla">'+item.l+'</span></div>';
      if(item.n)h+='<span class="sno">'+item.n+'</span>';
      h+='</div></div>';
    }
    h+='</div>';
  }
  h+='</div>';
  return h;
}

function section(key,icon,title,color,count,total,bodyHTML,defOpen){
  if(defOpen===undefined)defOpen=true;
  var open=secOpen(key,defOpen);
  var pv=total>0?Math.round(count/total*100):0;
  var done=count===total&&total>0;
  var bdr="1px solid "+(done?color:color+"44");
  var bg=done?color+"22":color+"0D";
  var iconStr=done?"&#9989;":icon;
  var h='<div class="ew" style="border:'+bdr+'">';
  h+='<button class="eh" style="background:'+bg+'" onclick="toggleSec(\''+key+'\','+(defOpen?'true':'false')+')">';
  h+='<span class="ei">'+iconStr+'</span>';
  h+='<span class="et" style="color:'+color+'">'+title+'</span>';
  if(total>0)h+='<span class="ec" style="color:'+color+';background:'+color+'22">'+count+'/'+total+'</span>';
  h+='<span style="font-size:10px;color:#555;margin-left:2px">'+(open?"&#9650;":"&#9660;")+'</span>';
  h+='</button>';
  if(total>0)h+='<div class="eb2" style="background:'+color+'0D">'+bar(pv,color,3)+'</div>';
  if(open)h+='<div class="eb">'+bodyHTML+'</div>';
  h+='</div>';
  return h;
}

function exRow(di,tipo,ex,color,tag){
  var done=iD(di,tipo,ex.id);
  var chkStyle="border:1.5px solid "+(done?color:"#333")+";background:"+(done?color:"transparent");
  var chk=done?'<span style="color:#fff;font-size:11px">&#10003;</span>':'';
  var h='<div class="xr">';
  h+='<button class="xc" style="'+chkStyle+'" onclick="tog('+di+',\''+tipo+'\',\''+ex.id+'\')">'+chk+'</button>';
  h+='<span class="xn'+(done?" dn":"")+'" style="color:'+(done?"#555":"#ddd")+'">'+ex.name+'</span>';
  h+='<span class="xt" style="color:'+color+'">'+tag+'</span>';
  h+='</div>';
  return h;
}

function chkRow(di,tipo,id,label,color,sub){
  var done=iD(di,tipo,id);
  var bdr="1px solid "+(done?color+"55":"#1E1E2E");
  var boxStyle="border:1.5px solid "+(done?color:"#444")+";background:"+(done?color:"transparent");
  var chk=done?'<span style="color:#fff;font-size:11px">&#10003;</span>':'';
  var h='<button class="kr" style="'+bdr+'" onclick="tog('+di+',\''+tipo+'\',\''+id+'\')">';
  h+='<div class="kb" style="'+boxStyle+'">'+chk+'</div>';
  h+='<div><div class="kl'+(done?" dn":"")+'">'+label+'</div>';
  if(sub)h+='<div class="ks">'+sub+'</div>';
  h+='</div></button>';
  return h;
}

function chart(data,goal,color){
  if(data.length<2)return '<div style="font-size:11px;color:#444;font-family:monospace;text-align:center;padding:10px">Regista 2+ medicoes para ver grafico</div>';
  var vals=[];
  for(var i=0;i<data.length;i++)vals.push(data[i].value);
  var mn=Math.min.apply(null,vals.concat([goal]))-4;
  var mx=Math.max.apply(null,vals.concat([goal]))+4;
  var W=300,H=65;
  var xp=function(i){return 8+(i/(data.length-1))*(W-16);};
  var yp=function(v){return H-8-((v-mn)/(mx-mn))*(H-16);};
  var gy=yp(goal);
  var path="";
  for(var i=0;i<data.length;i++){
    path+=(i===0?"M":"L")+xp(i).toFixed(1)+","+yp(data[i].value).toFixed(1);
  }
  var s='<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:65px;display:block">';
  s+='<line x1="8" y1="'+gy+'" x2="'+(W-8)+'" y2="'+gy+'" stroke="'+color+'" stroke-width="1" stroke-dasharray="4,3" opacity=".5"/>';
  s+='<text x="'+(W-10)+'" y="'+(gy-4)+'" fill="'+color+'" font-size="8" text-anchor="end" font-family="monospace">META '+goal+'cm</text>';
  s+='<path d="'+path+'" fill="none" stroke="'+color+'" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>';
  for(var i=0;i<data.length;i++){
    var cx=xp(i),cy=yp(data[i].value);
    s+='<circle cx="'+cx+'" cy="'+cy+'" r="3.5" fill="'+color+'"/>';
    s+='<text x="'+cx+'" y="'+(cy-6)+'" fill="'+color+'" font-size="8" text-anchor="middle" font-family="monospace">'+data[i].value+'</text>';
    s+='<text x="'+cx+'" y="'+(H-1)+'" fill="#555" font-size="7" text-anchor="middle" font-family="monospace">'+data[i].date+'</text>';
  }
  s+='</svg>';
  return s;
}

function renderDay(di){
  var p=ph(),phase=po(S.week),pl=plan(),d=pl[di];
  var gE=d.gym?GYM[d.gym]:[];
  var sE=d.skill?SKILL[d.skill]:[];
  var vE=d.vert?VERT[phase]:[];
  var gc=d.gym?GC[d.gym]:"#555";
  var gD=0,sD=0,vD=0,rD=0,mD=0,spD=0;
  for(var i=0;i<gE.length;i++)if(iD(di,"g",gE[i].id))gD++;
  for(var i=0;i<sE.length;i++)if(iD(di,"s",sE[i].id))sD++;
  for(var i=0;i<vE.length;i++)if(iD(di,"v",vE[i].id))vD++;
  for(var i=0;i<REC.length;i++)if(iD(di,"r",REC[i].id))rD++;
  for(var i=0;i<MEALS.length;i++)if(iD(di,"m",MEALS[i].id))mD++;
  for(var i=0;i<SUPPS.length;i++)if(iD(di,"sp",SUPPS[i].id))spD++;
  var tot=gE.length+sE.length+vE.length+REC.length+MEALS.length+SUPPS.length;
  var dn=gD+sD+vD+rD+mD+spD;
  var pct=tot>0?Math.round(dn/tot*100):0;
  var pc=pct===100?"#22C55E":p.c;
  var hbg=d.rest?"#12080A":"#0D0D1A";
  var hbdr="1px solid "+(d.rest?"#C6282833":p.c+"44");
  var hcolor=d.rest?"#C62828":p.c;

  var h='<div class="dh" style="background:'+hbg+';border:'+hbdr+'">';
  h+='<div class="dhi">';
  h+='<span style="font-size:26px">'+d.icon+'</span>';
  h+='<div style="flex:1"><div style="font-size:16px;font-weight:bold;color:'+hcolor+'">'+d.label+'</div>';
  h+='<div style="font-size:11px;color:#888;margin-top:1px">'+d.goal+'</div></div>';
  h+='<div style="text-align:right"><div style="font-size:20px;font-weight:bold;font-family:monospace;color:'+pc+';line-height:1">'+pct+'%</div>';
  h+='<div style="font-size:9px;color:#555;font-family:monospace">'+dn+'/'+tot+'</div></div>';
  h+='</div>';
  h+=bar(pct,pc,6);
  h+='</div>';

  h+=sched(phase,di);

  if(d.rest&&d.day==="Dom"){
    h+='<div class="rb"><div style="font-size:28px;margin-bottom:6px">&#128308;</div>';
    h+='<div style="font-size:13px;color:#C62828;font-weight:bold;margin-bottom:4px">Recuperacao Total</div>';
    h+='<div style="font-size:12px;color:#888">Zero impacto. E neste dia que o tendao cresce.</div></div>';
  }

  if(gE.length>0){
    var gb="";
    for(var i=0;i<gE.length;i++)gb+=exRow(di,"g",gE[i],gc,gE[i].sets);
    if(d.gym==="legs")gb+='<div class="wb2">HSR: 3s a descer, 3s a subir. Para se dor maior 4/10.</div>';
    h+=section("gm-"+di,"&#128170;",GL[d.gym],gc,gD,gE.length,gb,true);
  }
  if(sE.length>0){
    var skb="";
    for(var i=0;i<sE.length;i++)skb+=exRow(di,"s",sE[i],"#3B82F6",sE[i].tag);
    h+=section("sk-"+di,"&#127936;",SL[d.skill],"#3B82F6",sD,sE.length,skb,true);
  }
  if(vE.length>0){
    var vb="";
    for(var i=0;i<vE.length;i++)vb+=exRow(di,"v",vE[i],"#A855F7",vE[i].vol);
    vb+='<div class="hb" style="background:#0D0A14;border:1px solid #A855F733"><span style="font-size:11px;color:#A855F7">Regista o teu salto no Resumo apos a sessao.</span></div>';
    h+=section("vt-"+di,"&#11014;","Vertical Jump - "+p.label,"#A855F7",vD,vE.length,vb,true);
  }

  var rb="";
  for(var i=0;i<REC.length;i++)rb+=chkRow(di,"r",REC[i].id,REC[i].label,"#22C55E","");
  h+=section("rc-"+di,"&#129482;","Recuperacao","#22C55E",rD,REC.length,rb,true);

  var mb="";
  for(var i=0;i<MEALS.length;i++)mb+=chkRow(di,"m",MEALS[i].id,MEALS[i].label,"#F97316",MEALS[i].desc);
  h+=section("ml-"+di,"&#129367;","Refeicoes","#F97316",mD,MEALS.length,mb,true);

  var spb="";
  for(var i=0;i<SUPPS.length;i++)spb+=chkRow(di,"sp",SUPPS[i].id,SUPPS[i].label+(SUPPS[i].star?" *":""),"#C9A227",SUPPS[i].desc);
  spb+='<div class="sph">* = critico para o tendao. Colagenio 30-60 min ANTES do treino.</div>';
  h+=section("sp-"+di,"&#128138;","Suplementacao","#C9A227",spD,SUPPS.length,spb,false);

  return h;
}

function renderDash(){
  var p=ph(),pl=plan(),lv=latV(),lw=latW(),phase=po(S.week);
  var h='<div class="card"><div class="ch"><div class="ca" style="background:'+p.c+'"></div><span class="cl">SEMANA - TOCA PARA MUDAR</span><span style="margin-left:auto;font-size:10px;font-family:monospace;color:'+p.c+'">'+p.label+' - '+p.name+'</span></div><div class="cb wg">';
  for(var w=1;w<=12;w++){
    var p2=PH[po(w)-1],act=w===S.week;
    h+='<button class="wb'+(act?" on":"")+'" style="background:'+(act?p2.c:"#0D0D14")+';border-color:'+(act?p2.c:"#1E1E2E")+';color:'+(act?"#fff":"#555")+'" onclick="setW('+w+')">'+w+'</button>';
  }
  h+='</div></div>';

  h+='<div class="card"><div class="ch"><div class="ca" style="background:'+p.c+'"></div><span class="cl">PROGRESSO POR DIA</span></div><div class="cb" style="padding:12px">';
  for(var di=0;di<pl.length;di++){
    var dp=dayProg(di);
    var pv=dp.tot>0?Math.round(dp.done/dp.tot*100):0;
    var pvc=pv===100?"#22C55E":p.c;
    h+='<button class="dr" onclick="setV('+di+')">';
    h+='<span style="font-size:14px;min-width:22px">'+pl[di].icon+'</span>';
    h+='<span style="font-size:12px;color:#bbb;min-width:52px;font-family:monospace">'+pl[di].day+'</span>';
    h+='<div style="flex:1">'+bar(pv,pvc,5)+'</div>';
    h+='<span style="font-size:10px;color:'+(dp.tot>0?pvc:"#555")+';font-family:monospace;min-width:34px;text-align:right">'+(dp.tot>0?pv+"%":"&mdash;")+'</span>';
    h+='<span style="font-size:10px;color:#444">&#8250;</span></button>';
  }
  h+='</div></div>';

  var gD=0,gT=0,sD=0,sT=0,vD=0,vT=0,rD=0,rT=0,mD=0,mT=0,spD=0,spT=0;
  for(var di=0;di<pl.length;di++){
    var d=pl[di];
    var gE=d.gym?GYM[d.gym]:[],sE=d.skill?SKILL[d.skill]:[],vE=d.vert?VERT[phase]:[];
    for(var i=0;i<gE.length;i++){gT++;if(iD(di,"g",gE[i].id))gD++;}
    for(var i=0;i<sE.length;i++){sT++;if(iD(di,"s",sE[i].id))sD++;}
    for(var i=0;i<vE.length;i++){vT++;if(iD(di,"v",vE[i].id))vD++;}
    for(var i=0;i<REC.length;i++){rT++;if(iD(di,"r",REC[i].id))rD++;}
    for(var i=0;i<MEALS.length;i++){mT++;if(iD(di,"m",MEALS[i].id))mD++;}
    for(var i=0;i<SUPPS.length;i++){spT++;if(iD(di,"sp",SUPPS[i].id))spD++;}
  }

  var stats=[
    [{l:"Musculacao",v:gD,t:gT,c:"#EF4444",i:"&#128170;"},{l:"Skill Work",v:sD,t:sT,c:"#3B82F6",i:"&#127936;"}],
    [{l:"Vertical",v:vD,t:vT,c:"#A855F7",i:"&#11014;"},{l:"Recuperacao",v:rD,t:rT,c:"#22C55E",i:"&#129482;"}],
    [{l:"Refeicoes",v:mD,t:mT,c:"#F97316",i:"&#129367;"},{l:"Suplementos",v:spD,t:spT,c:"#C9A227",i:"&#128138;"}]
  ];
  for(var r=0;r<stats.length;r++){
    h+='<div class="sg">';
    for(var c=0;c<stats[r].length;c++){
      var s=stats[r][c];
      var spct=s.t>0?Math.round(s.v/s.t*100):0;
      h+='<div class="sb"><div style="font-size:9px;color:#555;font-family:monospace;letter-spacing:1px;margin-bottom:5px">'+s.i+' '+s.l.toUpperCase()+'</div>';
      h+='<div class="sv" style="color:'+s.c+'">'+s.v+'<span style="font-size:10px;color:#444">/'+s.t+'</span></div>';
      h+='<div style="margin:5px 0 3px">'+bar(spct,s.c,5)+'</div>';
      h+='<div class="sp">'+(s.t>0?spct+"%":"&mdash;")+'</div></div>';
    }
    h+='</div>';
  }

  h+='<div class="card"><div class="ch"><div class="ca" style="background:#A855F7"></div><span class="cl">VERTICAL & PESO</span></div><div class="cb">';
  h+='<div class="ir"><input id="vIn" type="number" class="ni" placeholder="Salto em cm"><button class="ab" style="background:#A855F7;color:#fff" onclick="addVert()">+ cm</button></div>';
  h+='<div class="ir"><input id="wIn" type="number" class="ni" placeholder="Peso em kg"><button class="ab" style="background:#F59E0B;color:#000" onclick="addWt()">+ kg</button></div>';
  h+='<div class="pp">';
  h+='<div class="pi"><div class="pl">Salto: '+lv+'cm de 72cm</div>'+bar(Math.min(100,Math.round(lv/72*100)),"#A855F7",6)+'</div>';
  h+='<div class="pi"><div class="pl">Peso: '+lw+'kg para 83kg</div>'+bar(Math.min(100,Math.round(((88-lw)/5)*100)),"#F59E0B",6)+'</div>';
  h+='</div>';
  h+=chart(S.verts,72,"#A855F7");
  h+='</div></div>';

  h+='<div class="ab2"><div class="at">REGRA DO TENDAO</div><div class="ab3">menor ou igual 3/10 durante = continua &middot; menor ou igual 4/10 depois = OK &middot; maior 4/10 = para</div></div>';
  return h;
}

function render(){
  var p=ph(),pl=plan();
  document.getElementById("hWk").textContent=S.week;
  document.getElementById("hWk").style.color=p.c;
  if(S.view==="dash"){
    document.getElementById("hTit").textContent="Semana "+S.week+" - "+p.name;
  } else {
    var d=pl[S.view];
    var g=d.goal.length>26?d.goal.substring(0,26)+"...":d.goal;
    document.getElementById("hTit").textContent=d.label+" - "+g;
  }
  document.getElementById("ps").style.borderBottom="1px solid "+p.c+"33";
  document.getElementById("pBg").textContent=p.label;
  document.getElementById("pBg").style.background=p.c;
  document.getElementById("pLb").textContent=p.range+" - "+p.name;
  document.getElementById("pLb").style.color=p.c;
  document.getElementById("ct").innerHTML=S.view==="dash"?renderDash():renderDay(S.view);

  var nav=document.getElementById("bn");
  nav.innerHTML="";
  var items=[{id:"dash",icon:"&#9889;",label:"Resumo"}];
  for(var i=0;i<pl.length;i++)items.push({id:i,icon:pl[i].icon,label:pl[i].day});
  for(var i=0;i<items.length;i++){
    var n=items[i];
    var act=S.view===n.id;
    var prog=typeof n.id==="number"?dayProg(n.id):null;
    var pv=prog&&prog.tot>0?Math.round(prog.done/prog.tot*100):null;
    var complete=pv===100;
    var nb=document.createElement("button");
    nb.className="nb"+(act?" on":"");
    nb.style.background=act?p.c:"transparent";
    nb.style.color=act?"#fff":complete?"#22C55E":"#555";
    var ic=complete&&!act?"&#9989;":n.icon;
    var inner='<span style="font-size:13px;line-height:1">'+ic+'</span><span style="font-size:9px;line-height:1">'+n.label+'</span>';
    if(pv!==null){inner+='<div class="np"><div class="npf" style="width:'+pv+'%;background:'+(act?"#fff":complete?"#22C55E":p.c)+'"></div></div>';}
    nb.innerHTML=inner;
    (function(id){nb.onclick=function(){setV(id);};})(n.id);
    nav.appendChild(nb);
  }
}

render();
</script>
