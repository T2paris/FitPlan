<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <title>FitTracker AI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Fira+Code:wght@400;600&family=Syne:wght@700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <script>
        window.onerror = function(msg, url, line, col, error) {
            const errDiv = document.createElement('div');
            errDiv.style.cssText = 'color:#ef4444;background:#111118;padding:20px;position:fixed;top:0;left:0;right:0;z-index:99999;border:1px solid #ef4444;font-family:monospace;white-space:pre-wrap;font-size:14px;';
            errDiv.innerHTML = '<strong>Error:</strong> ' + msg + '<br><strong>File:</strong> ' + url + '<br><strong>Line:</strong> ' + line + ':' + col + '<br><strong>Stack:</strong> ' + (error && error.stack ? error.stack : 'N/A');
            document.body.appendChild(errDiv);
        };
    </script>
</head>
<body>
    <div id="app"></div>
    
    <nav id="bottom-nav">
        <!-- Renderizado dinamicamente pelo AppController -->
    </nav>

    <!-- API Service -->
    <script src="js/services/api.js"></script>

    <!-- Models -->
    <script src="js/models/Store.js"></script>
    <script src="js/models/UserModel.js"></script>
    <script src="js/models/PlanModel.js"></script>
    <script src="js/models/StatsModel.js"></script>

    <!-- Views -->
    <script src="js/views/AuthView.js"></script>
    <script src="js/views/OnboardingView.js"></script>
    <script src="js/views/DashboardView.js"></script>
    <script src="js/views/DayView.js"></script>
    <script src="js/views/ChatView.js"></script>
    <script src="js/views/SettingsView.js"></script>

    <!-- Controllers -->
    <script src="js/controllers/AIController.js"></script>
    <script src="js/controllers/AppController.js"></script>

    <!-- Init -->
    <script src="js/app.js"></script>
</body>
</html>
